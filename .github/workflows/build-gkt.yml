name: Build Kiosk

on: [workflow_call]

defaults:
  run:
    shell: bash

jobs:
  build-gkt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test adapters and application
        run: pnpm run test

      - name: Build unified kiosk
        run: pnpm run build
