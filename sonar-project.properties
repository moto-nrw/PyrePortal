# Project information
sonar.projectKey=moto-nrw_PyrePortal
sonar.projectName=PyrePortal
sonar.organization=moto-nrw

# Source directories
sonar.sources=src

# Test directories
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript frontend configuration
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/*.d.ts,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/vite.config.ts

# Test exclusions
sonar.test.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage exclusions - test infrastructure and setup files
sonar.coverage.exclusions=\
  src/test/**,\
  src/vite-env.d.ts

# Security settings
sonar.security.hotspots.inheritFromParent=true

# errorCodes.generated.ts is generated from project-phoenix error-registry.json.
# Code names like identity.password_reset_link_invalid trip the hard-coded
# password rule; the file holds error code names and classes only, no secrets.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=src/services/errorCodes.generated.ts
